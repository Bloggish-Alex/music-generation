# Runtime configuration required by the migrated encoding path.

music_parser:
  quantize_input: true
  # Final V2 slot boundaries are the single canonical 0.25-QL grid.
  quantize_divisors: [4]
  quantize_offsets: true
  quantize_durations: true
  hard_safety_limit: 48
  track_retention_policy: error
  register_split_low_max: 55
  register_split_mid_max: 72
  default_velocity: 64

bar_tensor:
  backend: semantic_harmony_set_v2
  schema_version: bar_tensor_schema.v2
  overflow_policy: error
  steps_per_bar: 48
  pitch_scale: 24.0
  velocity_scale: 127.0
  melody_continuity_tolerance: 7
  max_harmony_notes: 16
  relative_pitch_max_semitones: 96.0
  slot_time_epsilon_ql: 0.000001

action_labeler:
  repeat_similarity_threshold: 0.95
  return_similarity_threshold: 0.85
  return_min_consecutive: 2
  theme_anchor_bars: 4
  introduce_bars: 8
  develop_multiplier: 1.3
  phrase_length_bars: 8
  cadence_tail_bars: 2
  cadence_density_multiplier: 0.75
  cadence_variance_multiplier: 0.75
  tonic_pitch_classes: [0, 7]
