include: style_defaults.yaml

bar_tensor:
  backend: semantic_harmony_set_v2
  schema_version: bar_tensor_schema.v2
  steps_per_bar: 48
  pitch_scale: 24.0
  velocity_scale: 127.0
  max_harmony_notes: 16
  relative_pitch_max_semitones: 96.0
  overflow_policy: error
  slot_time_epsilon_ql: 0.000001

# Stable, content-independent split assignment. The base_song_id hash makes the
# partition reproducible across machines and stable under transpose variants.
evaluation_splits:
  strategy: sha256_modulo
  validation_modulus: 5
  validation_remainder: 0
