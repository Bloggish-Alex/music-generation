# The planner sees an unmasked four-bar future trajectory, but only one planned
# bar is committed, decoded, and fed back before the next plan is sampled.
# Contract: trajectory_diffusion.context_bars == commit_bars and
# trajectory_diffusion.memory_bars == memory_bars. warmup_bars must be divisible
# by commit_bars. These values jointly define one recurrent system.
trajectory_recurrence:
  enabled: true
  commit_bars: 1
  warmup_bars: 16
  segments_per_update: 16
  memory_bars: 32

trajectory_decoded_harmony:
  enabled: true
  state_loss_weight: 1.0
  delta_loss_weight: 1.0
  pitch_scale: 24.0
  pitch_class_sigma: 0.35
