# HMM music generation experiment defaults.
#
# These parameters affect generated structure or audible output, so keep them
# in config or expose them through CLI instead of hard-coding in stage classes.

grid_tokenizer:
  steps_per_bar: 16
  bar_length_ql: 4.0
  rest_token: -1
  sustain_token: -2
  polyphonic_strategy: melody_top
  # Quantize parsed symbolic music before note extraction. This prevents small
  # human-performance MIDI timing drift, such as 0.99 quarter notes, from
  # creating unstable edit-distance tokens.
  quantize_input: true
  quantize_divisors: [4, 3]
  quantize_offsets: true
  quantize_durations: true
  quantize_policy: nearest
  min_overlap_fraction: 0.05

encoder:
  backend: legacy  # legacy or vae_latent

vae_encoder:
  steps_per_bar: 16
  hidden_dim: 32
  latent_dim: 8
  epochs: 80
  batch_size: 128
  learning_rate: 0.001
  beta_kl: 0.001
  kl_warmup_epochs: 10
  pitch_weight: 1.0
  note_drop_prob: 0.15
  sustain_fill_prob: 0.10
  drop_to_rest_prob: 0.5
  ornament_pitch_radius: 2
  pitch_scale: 24.0
  random_seed: 42
  device: cpu
  clustering:
    method: kmeans
    n_clusters: 192
    distance_threshold: 1.0
    linkage_method: average
    random_seed: 42

distance_matrix:
  backend: autoencoder_edit_distance  # token, multi_channel, or autoencoder_edit_distance
  # If gamma is null, the builder estimates sigma from the median non-zero
  # edit distance and uses gamma_scale / (2 * sigma^2).
  gamma: null
  gamma_scale: 1.0
  # Normalize edit distance to [0, 1] by dividing by max sequence length.
  # This makes agglomerative distance_threshold a percentage-like tolerance:
  # 0.25 means roughly 25% of the bar grid may differ.
  normalize_distance: true
  token_offset: 2
  # Diagnostic token strategy. With backend=multi_channel, actual distance is
  # computed from rhythm, contour, and pitch-relative channels below.
  token_strategy: relative
  root_pitch_class_token_multiplier: 100
  multi_channel:
    rhythm_weight: 0.45
    contour_weight: 0.35
    pitch_weight: 0.20
  context_features:
    root_pitch_class:
      enabled: false
      # Adds a small penalty for bars whose lowest note-on pitch class differs.
      # The base 16-step edit distance remains the dominant clustering signal.
      weight: 0.03
    position_bucket:
      enabled: false
      # Relative position is bucketed by bar_index / (source_bar_count - 1).
      # Keep this weight small, otherwise clustering starts grouping by form
      # location instead of musical material.
      bucket_count: 8
      weight: 0.01

bar_autoencoder:
  enabled: true
  token_strategy: relative
  # Direct narrow autoencoder: 16 token values -> Dense(latent_dim) -> 16 token values.
  latent_dim: 8
  epochs: 80
  batch_size: 128
  learning_rate: 0.001
  random_seed: 42
  device: cpu  # cpu, cuda, or auto
  normalize_latent: true
  # Quantize the 8 latent values into integer tokens, then run Levenshtein on
  # that 8-token sequence.
  quantization_bins: 32
  quantization_clip: 3.0

bar_clustering:
  backend: global_agglomerative  # global_agglomerative, agglomerative, or spectral

kmeans_clustering:
  enabled: true
  n_clusters: 64
  random_seed: 42

observation_vocab:
  strategy: positioned_composite  # composite or positioned_composite
  position_strategy: exact_mod  # exact_mod or period_role
  position_modulo: 8
  position_source: bar_index
  key_format: structured

bar_density:
  sparse_active_duration_ql: 2.0
  sparse_note_on_count: 2
  sparse_rest_ratio: 0.5
  semi_sparse_active_duration_ql: 3.5
  semi_sparse_note_on_count: 6
  semi_sparse_rest_ratio: 0.25

spectral_clustering:
  n_clusters: 8
  assign_labels: kmeans
  random_seed: 42

agglomerative_clustering:
  distance_threshold: 0.25
  linkage: average
  criterion: distance
  min_clusters_warn: 3
  max_clusters_warn_fraction: 0.6

global_agglomerative_clustering:
  # First cluster bars within each song, then align each song-cluster medoid
  # through a shared global codebook. This keeps local song structure intact
  # while giving all songs the same bar-label vocabulary for HMM training.
  song_distance_threshold: 0.25
  song_max_clusters: 48
  codebook_size: 192
  codebook_clustering_strategy: default  # default or filtered_rare_bar
  codebook_filter_min_bar_count: 3
  # Build the global codebook by distance first. Fixed-size maxclust alone can
  # merge unrelated medoids, then assignment collapses many bars into one label.
  codebook_distance_threshold: 0.35
  assignment_distance_threshold: 0.35
  expand_codebook_on_assignment_miss: true  # valid only when codebook_clustering_strategy is default
  song_linkage: average
  codebook_linkage: average
  criterion: distance # comment: useless, code always do distance first and then check if max clusters satisfied
  min_clusters_warn: 3
  max_clusters_warn_fraction: 0.6

section_hmm:
  backend: numpy  # numpy or hsmm
  n_sections: 4
  max_iter: 80
  tol: 0.0001
  self_transition_bias: 3.0
  emission_smoothing: 0.2
  transition_smoothing: 0.5
  # Used by backend=hsmm. HSMM learns an explicit state-duration distribution
  # instead of relying on HMM self-loop probabilities for section length.
  duration_smoothing: 0.2
  duration_warm_start_strength: 8.0
  max_duration: null
  hsmm_allow_self_loop: false
  require_final_state: true
  max_expected_segment_operations: 20000000
  random_seed: 42
  topology: left_to_right
  max_forward_jump: 1
  allow_self_loop: true
  warm_start_strength: 2.0

forms:
  sonata:
    sections:
      - name: Expo_Primary
        length: 8
        pitch_offset: 0
        cadence: perfect # 完美全终止
      - name: Expo_Transition
        length: 8
        pitch_offset: 2
        cadence: half #
      - name: Expo_Secondary
        length: 8
        pitch_offset: 7
        cadence: perfect #
      - name: Expo_Codetta
        length: 8
        pitch_offset: 7
        cadence: perfect #
      - name: Dev_Core
        length: 16
        pitch_offset: 9
        cadence: open #
      - name: Recap_Primary
        length: 8
        pitch_offset: 0
        cadence: perfect #
      - name: Recap_Transition
        length: 8
        pitch_offset: 5
        cadence: half #
      - name: Recap_Secondary
        length: 8
        pitch_offset: 0
        cadence: perfect #
      - name: Recap_Coda
        length: 8
        pitch_offset: 0
        cadence: perfect #
  ternary: # ABA
    sections:
      - name: Theme_A
        length: 16
        pitch_offset: 0
        cadence: perfect # 完美全终止
      - name: Theme_B
        length: 16
        pitch_offset: 7
        cadence: open   # 转属调，开放结尾
      - name: Theme_A_Recap
        length: 16
        pitch_offset: 0
        cadence: perfect # 回主调，完美全终止
        source: Theme_A
  binary: # AB
    sections:
      - name: Theme_A
        length: 16
        pitch_offset: 0 # 留悬念的半终止
        cadence: half
      - name: Theme_B
        length: 16
        pitch_offset: 7
        cadence: perfect # 属调出发，强终止收尾
  rondo: # ABACA
    sections:
      - name: Theme_A1
        length: 8
        pitch_offset: 0
        cadence: perfect
      - name: Episode_B
        length: 8
        pitch_offset: 7
        cadence: half
      - name: Theme_A2
        length: 8
        pitch_offset: 0
        cadence: perfect
        source: Theme_A1
      - name: Episode_C
        length: 8
        pitch_offset: 9
        cadence: open
      - name: Theme_A3_Final
        length: 8
        pitch_offset: 0
        cadence: perfect
  pop_standard: # pop
    sections:
      - name: Verse
        length: 16
        pitch_offset: 0 #  流行乐中间自由流动
        cadence: none
      - name: Chorus
        length: 16
        pitch_offset: 0
        cadence: perfect # 副歌结尾做强终止
      - name: Bridge
        length: 8
        pitch_offset: 5
        cadence: none # 桥段转到下属调
      - name: Chorus
        length: 16
        pitch_offset: 2
        cadence: perfect # 副歌高潮整体升调(飙高音)

hmm_generation:
  # Temperatures above 1.0 flatten over-confident HMM distributions during
  # generation without changing the trained matrices saved in the model.
  transition_temperature: 1.2
  emission_temperature: 1.6
  # null disables the cap. A modest label cap prevents one emitted bar type
  # from dominating the rendered MIDI when an HMM state has a sharp emission.
  max_same_label_run: 4
  max_same_state_run: null
  avoid_exact_bar_repeat: true
  # none disables section source reuse. sampled_path reuses the source
  # section's exact sampled observations and concrete bars. anchor_resample
  # keeps the source section as an anchor while resampling similar bars.
  source_reuse_mode: anchor_resample

candidate_selector:
  # Learned post-emission selector. Decoder still emits a global codebook ID;
  # this layer only chooses the concrete physical bar inside that codebook pool.
  enabled: true
  backend: learned_ranker  # none, heuristic, or learned_ranker
  model_type: mlp
  selection_stage: candidate  # candidate or joint
  train_enabled: true
  negatives_per_positive: 3
  hidden_dim: 16
  epochs: 160
  learning_rate: 0.01
  l2: 0.0001
  random_seed: 42
  min_candidates: 2
  top_k: 32
  temperature: 0.9
  learned_weight: 1.0
  harmony_weight: 0.5
  position_weight: 0.25
  boundary_weight: 0.5
  boundary_sigma: 8.0
  latent_weight: 0.15
  latent_sigma: 4.0
  observation_top_k: 16
  candidates_per_observation: 5
  observation_emission_weight: 2.2
  min_score: 1.0e-9
  diagnostics_top_k: 5

harmonic_engine:
  style: classic
  key: C
  mode: major
  base_octave: 3
  matrix_path: harmony_matrix.json
  min_bar_base_pitch: 32
  max_bar_base_pitch: 60
  rest_token: -1
  sustain_token: -2
  default_start_degree: I
  fallback_policy: raw
  rare_bar_selector:
    enabled: true
    min_candidates: 100
    harmony_weight: 1.0
    state_weight: 1.0
    density_weight: 2.0
    position_weight: 0.5
    density_sigma: 0.25
    position_sigma: 0.35
    top_k: 32
    temperature: 0.5
    min_score: 1.0e-9
    diagnostics_top_k: 5

harmonic_render:
  tempo: 120
  time_signature: 4/4
  velocity: 72
  track_mode: single  # single or split_by_pitch
  voice_sharing_enabled: false
  voice_sharing_threshold: 0.8
  tracks:
    - name: high
    - name: middle
    - name: low

midi_render:
  tempo: 120
  time_signature: 4/4
  velocity: 72
  channel: 0
